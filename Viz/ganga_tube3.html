<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1c1c28;font-family:'Space Mono',monospace;overflow:hidden}
svg{display:block;cursor:grab}
svg:active{cursor:grabbing}
path.river{fill:none;stroke-linecap:round;stroke-linejoin:round}
path.shadow{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke:#1c1c28}
#tip{position:fixed;background:#fff;color:#1c1c28;padding:7px 14px;
  font-size:11px;letter-spacing:.08em;pointer-events:none;
  opacity:0;transition:opacity .12s;white-space:nowrap;z-index:100;
  border-left:4px solid #fff}
#title{position:fixed;top:18px;left:22px;line-height:1.6;z-index:10}
#title h1{font-size:14px;font-weight:700;letter-spacing:.2em;color:#fff;text-transform:uppercase}
#title p{font-size:9px;letter-spacing:.13em;color:#444;margin-top:3px}
#ctrls{position:fixed;top:80px;left:22px;z-index:10;display:flex;flex-direction:column;gap:4px}
.btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);
  color:#aaa;font-family:'Space Mono',monospace;font-size:9px;padding:5px 10px;
  cursor:pointer;letter-spacing:.1em;transition:all .15s;text-transform:uppercase}
.btn:hover{background:rgba(255,255,255,0.12);color:#fff}
#info{position:fixed;bottom:14px;left:22px;font-size:10px;letter-spacing:.08em;
  color:#444;line-height:1.9;z-index:10;max-width:380px}
#legend-panel{position:fixed;top:18px;right:20px;z-index:10;
  background:rgba(10,10,20,0.92);border:1px solid rgba(255,255,255,0.08);
  padding:14px 16px;max-height:calc(100vh-40px);overflow-y:auto;width:170px}
#leg-hd{font-size:8px;letter-spacing:.18em;color:#333;margin-bottom:10px;text-transform:uppercase}
.leg-row{display:flex;align-items:center;gap:9px;margin-bottom:8px;cursor:pointer;
  transition:opacity .15s}
.leg-row:hover{opacity:.7}
.swatch{height:4px;border-radius:2px;flex-shrink:0}
.rname{font-size:9px;letter-spacing:.06em;color:#888;text-transform:uppercase}
#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  color:#fff;font-size:13px;letter-spacing:.25em}
</style>
</head>

  const byColor={};
  for(const p of paths){

    byColor[p.c].push(p);

  // Sort: thin first, thick on top
  const sorted=[...paths].sort((a,b)=>a.w-b.w);

        tip.textContent=place;
        infoEl.innerHTML=
          `<span style="color:#fff">${place}</span><br>`+
          `<span style="color:${col}">${st.river_in}</span> → ${st.river_out}<br>`+
          `<span style="color:#555">${rivers.join(' · ')}</span>`;
      })
      .on("mousemove",ev=>{
        tip.style.left=(ev.clientX+16)+"px";
        tip.style.top=(ev.clientY-14)+"px";
      })
      .on("mouseout",()=>{
        tip.style.opacity=0;
        infoEl.textContent="HOVER A CONFLUENCE STATION";
      });

    // Label
    const isRight=st.lon<83;
    labG.append("text")
      .attr("x",sx+(isRight?R+7:-(R+7)))
      .attr("y",sy+(isX?1:-(R+4)))
      .attr("text-anchor",isRight?"start":"end")
      .attr("font-size",isX?12:9)
      .attr("font-weight",isX?"700":"400")
      .attr("fill","#fff")
      .attr("letter-spacing","0.05em")
      .attr("font-family","Space Mono,monospace")
      .attr("pointer-events","none")
      .text(place);
  }

  // Legend
  const legPanel=document.getElementById("legend-panel");
  for(const [color,name] of Object.entries(LEGEND).sort((a,b)=>a[1].localeCompare(b[1]))){
    const hasData=!!colorGroups[color];
    const row=document.createElement("div");
    row.className="leg-row";
    row.style.opacity=hasData?"1":"0.3";
    row.innerHTML=`<div class="swatch" style="background:${color};width:${hasData?28:16}px"></div>`+
      `<div class="rname">${name}</div>`;
    row.addEventListener("mouseover",()=>{
      if(!hasData) return;
      Object.values(colorGroups).forEach(g=>g.attr("opacity",0.07));
      colorGroups[color].attr("opacity",1);
    });
    row.addEventListener("mouseout",()=>{
      Object.values(colorGroups).forEach(g=>g.attr("opacity",1));
    });
    legPanel.appendChild(row);
  }

  // Controls
  d3.select("#z+").on("click",()=>svg.transition().duration(250).call(zoom.scaleBy,1.65));
  d3.select("#z-").on("click",()=>svg.transition().duration(250).call(zoom.scaleBy,0.6));
  d3.select("#zr").on("click",()=>svg.transition().duration(350).call(zoom.transform,d3.zoomIdentity));
  let labOn=true;
  d3.select("#tl").on("click",function(){
    labOn=!labOn;labG.attr("display",labOn?null:"none");
  });

  // Frame
  svg.append("rect").attr("x",10).attr("y",10)
    .attr("width",W-20).attr("height",H-20)
    .attr("fill","none").attr("stroke","rgba(255,255,255,0.05)")
    .attr("stroke-width",1).attr("pointer-events","none");
})();
</script>
</body>
</html>
